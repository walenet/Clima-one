name: Android install and launch smoke test
on:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          sudo chmod 666 /dev/kvm || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build current CLIMA ONE code
        run: gradle --no-daemon assembleDebug
      - name: Install and launch on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.climaone.lab/com.climaone.app.MainActivity
            sleep 5
            adb shell pidof com.climaone.lab
            adb shell screencap -p /sdcard/clima-one-screen.png
            adb pull /sdcard/clima-one-screen.png clima-one-screen.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml window.xml
            adb logcat -d -s AndroidRuntime:E > android-errors.txt || true
            if grep -q 'FATAL EXCEPTION' android-errors.txt; then cat android-errors.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CLIMA-ONE-Emulator-Verification
          path: |
            clima-one-screen.png
            window.xml
            android-errors.txt
          if-no-files-found: warn
