name: CLIMA ONE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER" || { echo 'No Android SDK manager found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build current repository Android sources
        run: gradle --no-daemon assembleDebug
      - name: Verify Android package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -15
          cp "$APK" CLIMA_ONE_ProControls_v0.5.apk
          sha256sum CLIMA_ONE_ProControls_v0.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLIMA-ONE-Android-APK
          path: CLIMA_ONE_ProControls_v0.5.apk
          if-no-files-found: error
      - name: Create public download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-pro-controls-v05-20261018 >/dev/null 2>&1 || gh release create android-pro-controls-v05-20261018 --title "CLIMA ONE Pro Controls v0.5" --notes "Alpha 0.5: nuova interfaccia a feedback tattile, profili ECO+ con setpoint standard, ventilatore interno 20/40/60/80/100%, CSV tecnico. Nessuna modifica dei limiti di compressore e ventola esterna. Controlli non verificati su tutti i firmware Midea."
          gh release upload android-pro-controls-v05-20261018 CLIMA_ONE_ProControls_v0.5.apk --clobber
