name: CLIMA ONE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER" || { echo 'No Android SDK manager found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract project and compile APK
        run: |
          unzip -q CLIMA_ONE_ANDROID_NATIVA_v0.1.zip -d source
          cd source/CLIMA_ONE_Android_Native
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CLIMA-ONE-Android-APK
          path: source/CLIMA_ONE_Android_Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
