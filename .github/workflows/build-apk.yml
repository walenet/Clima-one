name: CLIMA ONE Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER" || { echo 'No Android SDK manager found'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build current repository Android sources
        run: gradle --no-daemon assembleDebug
      - name: Verify Android package and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -15
          cp "$APK" CLIMA_ONE_Android_LAN_v0.3.apk
          sha256sum CLIMA_ONE_Android_LAN_v0.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CLIMA-ONE-Android-APK
          path: CLIMA_ONE_Android_LAN_v0.3.apk
          if-no-files-found: error
      - name: Create public download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-lan-alpha-20261018 >/dev/null 2>&1 || gh release create android-lan-alpha-20261018 --title "CLIMA ONE Android LAN Pairing alpha v0.3" --notes "Versione alpha: test collegamento diretto V3 sulla rete locale. Richiede token e key V3 validi, ottenuti separatamente o via recupero una tantum da servizio Midea con autorizzazione. La lettura di stato reale e il controllo non sono ancora verificati sul modello pilota. Nessuna modifica firmware."
          gh release upload android-lan-alpha-20261018 CLIMA_ONE_Android_LAN_v0.3.apk --clobber
