name: Direct PRO APK
on:
  push:
    paths:
      - '.github/workflows/publish-pro-download.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place verified APK in download directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p downloads
          gh release download android-pro-v07-20261019 --pattern CLIMA_ONE_PRO_v0.7.apk --dir downloads --clobber
          test -s downloads/CLIMA_ONE_PRO_v0.7.apk
          sha256sum downloads/CLIMA_ONE_PRO_v0.7.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/CLIMA_ONE_PRO_v0.7.apk
          if ! git diff --staged --quiet; then
            git commit -m 'release: publish CLIMA ONE PRO APK via raw GitHub'
            git push
          fi
